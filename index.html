  <body>
    <div id="root"></div>
    <script>
      (function () {
        function removeBoltBadge() {
          document.querySelectorAll('a[href*="bolt.new"], [class*="bolt-badge"], [id*="bolt-badge"]').forEach(function (el) {
            el.remove();
          });
        }
        removeBoltBadge();
        new MutationObserver(removeBoltBadge).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
